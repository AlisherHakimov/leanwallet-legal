<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeanWallet · Legal</title>
  <style>
    :root { --accent: #5b5bd6; --bg: #ffffff; --fg: #1a1a2e; --muted: #6b7280; --border: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --accent: #7c6cf5; --bg: #14141f; --fg: #e5e7eb; --muted: #9ca3af; --border: #2a2a3a; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--fg); line-height: 1.6;
      max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem;
      display: flex; flex-direction: column; min-height: 100vh; }
    .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 2rem; }
    .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1.3rem; }
    h1 { font-size: 1.6rem; }
    p { color: var(--muted); margin: 0.75rem 0 2rem; }
    a.card { display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.25rem; border: 1px solid var(--border); border-radius: 12px;
      text-decoration: none; color: var(--fg); margin-bottom: 0.75rem; transition: border-color .15s; }
    a.card:hover { border-color: var(--accent); }
    a.card span.arrow { color: var(--accent); font-size: 1.2rem; }
    footer { margin-top: auto; padding-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">L</div>
    <strong style="font-size:1.2rem;">LeanWallet</strong>
  </div>
  <h1>Legal</h1>
  <p>Privacy Policy and Terms of Service for the LeanWallet app.</p>

  <a class="card" href="privacy.html">
    <span>🔒 Privacy Policy</span><span class="arrow">→</span>
  </a>
  <a class="card" href="terms.html">
    <span>📄 Terms of Service</span><span class="arrow">→</span>
  </a>

  <footer>© 2026 LeanWallet. All rights reserved.</footer>
</body>
</html>
